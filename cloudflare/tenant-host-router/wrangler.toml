name = "tenant-host-router"
main = "worker.js"
compatibility_date = "2024-01-01"

# ============================================================================
# WORKER ROUTES ARE INTENTIONALLY NOT DECLARED HERE.
# ============================================================================
# When `routes = [...]` is present in wrangler.toml, `wrangler deploy` treats
# this file as the source of truth for every route attached to the worker
# script — and SILENTLY DELETES any route pointing at the script that isn't
# in the list. That wiped a customer's API-provisioned route once
# (lp.frambam.com → HTTP 525, May 2026). We never want it to happen again.
#
# Routes are now managed exclusively via the Cloudflare API:
#
#   1. Per-tenant routes: `provisionCustomDomain()` in
#      `artifacts/api-server/src/lib/cloudflare.ts` creates a Custom Hostname
#      AND a Worker Route atomically when a customer adds a custom domain
#      (with rollback if either side fails).
#
#   2. Platform routes (`*.lpstudio.ai/*`, the Dandy production hostnames,
#      etc.): reconciled by `artifacts/api-server/scripts/sync-worker-routes.ts`.
#      That script is idempotent and is the authoritative way to (re)attach
#      both platform routes and every tenant route stored in the DB.
#
# Operational rule after `wrangler deploy`:
#   - Run `pnpm --filter @workspace/api-server exec tsx scripts/sync-worker-routes.ts`
#     (belt-and-suspenders even though removing `routes = [...]` should mean
#     wrangler no longer touches Worker Routes).
#
# Adding `routes = [...]` back to this file WILL cause data loss again.
# Don't.
# ============================================================================

# R2 bucket containing prerendered landing-page HTML (task #364).
# Worker reads `<host>/<slug>.html` keys on every GET/HEAD to a
# landing-page URL. Provisioned manually; writes are made by the
# api-server's `triggerPublishedRender` via the S3-compatible API.
[[r2_buckets]]
binding     = "PRERENDERED_LP"
bucket_name = "dandy-lp-prerendered"

# WORKER_HOST_SECRET is provided as a worker secret (not stored in this file).
# Set it with:  npx wrangler secret put WORKER_HOST_SECRET
# Use the SAME value as the WORKER_HOST_SECRET secret on the Replit deployment.
