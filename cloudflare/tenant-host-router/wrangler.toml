name = "tenant-host-router"
main = "worker.js"
compatibility_date = "2024-01-01"

# Routes: catch every subdomain of lpstudio.ai. Wildcard routes do NOT match
# the apex (lpstudio.ai), so the apex bypasses this worker entirely and goes
# through Cloudflare's normal proxy → Replit edge.
#
# The route DOES match app.lpstudio.ai and www.lpstudio.ai, but the worker
# itself short-circuits those (PASSTHROUGH_HOSTS) so they pass through.
#
# Customer-owned domains (e.g. meetdandy-lp.com, lp.meetdandy.com, and any
# future ENT customer domain) onboard via TWO independent CF steps that
# wrangler does NOT manage:
#   1. SSL/TLS → Custom Hostnames → "Add hostname"  (provisions the cert
#      and routes traffic into CF via Fallback Origin)
#   2. The lpstudio.ai zone → Workers Routes → "Add route" with pattern
#      `<customer-domain>/*` and Worker `tenant-host-router`  (causes this
#      worker to fire on the customer hostname — without it, traffic
#      bypasses the worker entirely and goes straight to the Fallback
#      Origin / Replit edge; R2 is never consulted).
# Verified Phase 2 (task #364, May 2026): both steps required; either
# alone silently falls back to passthrough.
routes = [
  { pattern = "*.lpstudio.ai/*", zone_name = "lpstudio.ai" },
  # Tenant 5 (Dandy SMB) — both the app domain (used during phase 2
  # curl-resolve testing) and the production microsite host.
  { pattern = "meetdandy-lp.com/*", zone_name = "lpstudio.ai" },
  { pattern = "lp.meetdandy.com/*", zone_name = "lpstudio.ai" },
  # Tenant 1 (Dandy ENT) — production microsite host.
  # The app domain (ent.meetdandy.com) intentionally has no worker route;
  # it stays on the Dandy app origin (currently 34.111.179.208 / GCP).
  { pattern = "partners.meetdandy.com/*", zone_name = "lpstudio.ai" },
]

# R2 bucket containing prerendered landing-page HTML (task #364).
# Worker reads `<host>/<slug>.html` keys on every GET/HEAD to a
# landing-page URL. Provisioned manually; writes are made by the
# api-server's `triggerPublishedRender` via the S3-compatible API.
[[r2_buckets]]
binding     = "PRERENDERED_LP"
bucket_name = "dandy-lp-prerendered"

# WORKER_HOST_SECRET is provided as a worker secret (not stored in this file).
# Set it with:  npx wrangler secret put WORKER_HOST_SECRET
# Use the SAME value as the WORKER_HOST_SECRET secret on the Replit deployment.
