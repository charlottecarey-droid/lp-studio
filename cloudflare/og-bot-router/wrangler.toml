name       = "og-bot-router"
main       = "worker.js"
compatibility_date = "2024-01-01"

# Enables the workers.dev URL (og-bot-router.<account>.workers.dev) for
# staging-gate testing. Default `wrangler deploy` (no --env) publishes
# here WITHOUT attaching the production meetdandy.com routes.
workers_dev = true

# R2 bucket containing prerendered landing-page HTML (task #364).
# Provisioned manually by the user; writes are made by the api-server's
# `triggerPublishedRender` via the S3-compatible API.
[[r2_buckets]]
binding     = "PRERENDERED_LP"
bucket_name = "dandy-lp-prerendered"

# api-server origin (used by tier-2 fallback in worker.js).
# HOST_OVERRIDE_ENABLED enables X-LP-Host / ?__host= override for the
# staging gate (worker.js#resolveLookupHost). Intentionally absent
# from [env.production.vars] so production silently ignores the
# override even if an attacker sends the header.
#
# API_ORIGIN here is intentionally pointed at a non-routable address
# (TEST-NET-1, RFC 5737) so the staging worker has NO working tier-2.
# This makes the gate's "api-server DOWN" steps real (step 4) and
# prevents the staging worker from accidentally hammering production
# api-server. Production env below points at the real origin.
[vars]
API_ORIGIN = "https://192.0.2.1"
HOST_OVERRIDE_ENABLED = "1"

# ---------------------------------------------------------------------
# Production environment. Deploy with: `npx wrangler deploy --env production`.
# Note: named environments in wrangler do NOT inherit top-level
# [[r2_buckets]] / [vars] — they're duplicated below so production has
# the same R2 binding and origin var as the default (staging) deploy.
# ---------------------------------------------------------------------
[env.production]

# Routes: intercept traffic on every meetdandy.com host that serves landing
# pages. The /* wildcard means all paths reach the worker, but the script
# itself only intercepts root-slug + /lp/<slug> URLs (see APP_PATH_DENY).
routes = [
  { pattern = "lp.meetdandy.com/*",       zone_name = "meetdandy.com" },
  { pattern = "partners.meetdandy.com/*", zone_name = "meetdandy.com" },
]

[[env.production.r2_buckets]]
binding     = "PRERENDERED_LP"
bucket_name = "dandy-lp-prerendered"

[env.production.vars]
API_ORIGIN = "https://ent.meetdandy.com"
