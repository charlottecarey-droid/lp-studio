<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Defensive stub for `window.webkit.messageHandlers`. iOS Safari
         (and the Facebook / Instagram in-app browsers in particular) does
         NOT define `window.webkit` outside of a WKWebView bridge, but
         several third-party tags we load via GTM / Marketo probe it
         without a guard (e.g. `window.webkit.messageHandlers.foo`),
         which throws `TypeError: undefined is not an object` and
         bubbles to Sentry. Defining a harmless empty stub at the top
         of <head> — before ANY other script runs — lets the probe read
         `undefined` instead of throwing, eliminating the error class
         entirely. Safe to set on real WKWebViews too: native bridges
         set `window.webkit` BEFORE any page script runs, so our `if`
         guard leaves real bridges untouched. -->
    <script>
      if (typeof window.webkit === 'undefined') {
        window.webkit = { messageHandlers: {} };
      } else if (!window.webkit.messageHandlers) {
        window.webkit.messageHandlers = {};
      }
    </script>
    <!-- OneTrust → GTM bridge. MUST be defined before the OneTrust SDK
         initialises (OneTrust itself is loaded BY GTM, not by us), which is
         why it lives here rather than in the app bundle.

         TEMPORARY, and marked for deletion. The GTM container currently gates
         tags behind trigger groups whose second member waits for a dataLayer
         event named `OneTrustGroupsUpdated`. That event appears exactly once
         in the published container — as the listener — and nothing pushes it,
         so those groups never complete. Measured on
         lp.meetdandy.com/inside-dandy 2026-08-03 with consent fully granted
         (`,C0003,C0001,C0004,C0002,`): Webflow Optimize (needs C0003) was
         never injected, and the Meta Pixel + LinkedIn base libraries (need
         C0004) never loaded — the "fbq is not defined" / "window.lintrk is
         not a function" console errors.

         REMOVE THIS once the container re-triggers those groups on Consent
         Mode / gtm.init_consent instead of the legacy event. Deleting it
         before that silently re-breaks all three integrations.

         It only forwards a decision OneTrust has already made; it cannot
         grant consent that wasn't given, and it sets no Consent Mode
         defaults — OneTrust's own GTM template owns those. -->
    <script>
      window.OptanonWrapper = function () {
        try {
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            event: 'OneTrustGroupsUpdated',
            OnetrustActiveGroups: window.OnetrustActiveGroups || '',
          });
        } catch (_) {
          /* never let a consent bridge break the page */
        }
      };
    </script>
    <!-- Google Tag Manager — lp.meetdandy.com only. Intentionally NOT loaded
         on partners.meetdandy.com (the GTM container ships marketing popups
         we don't want firing for partner traffic). -->
    <script>if (location.hostname === 'lp.meetdandy.com') { (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-NHJFVSJ'); }</script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Force browsers to revalidate index.html on every navigation so a fresh
         deploy's hashed /assets/* filenames are picked up immediately, instead
         of a stale cached HTML pointing at chunk URLs that no longer exist.
         Hashed asset files themselves stay long-cached (they're content-hashed). -->
    <meta http-equiv="cache-control" content="no-store" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <title>Landing Page Studio</title>
    <link rel="icon" type="image/svg+xml" href="/brand/favicon-navy.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
    <!-- lpstudio.ai marketing metadata only.
         Any lpstudio.ai host (apex, www, app, and any tenant subdomain) gets
         the LP Studio default share card. Tenant / Dandy hosts
         (ent/lp/partners.meetdandy.com, custom domains) are deliberately NOT
         handled here — their fallback metadata comes from the tenant's
         brand-settings defaults (tenants.default_og_*), applied by the SPA
         once the tenant resolves (browser) and by the api-server
         og-preview / og-host-preview endpoints (scrapers). Published tenant
         pages still override per-page via the prerender injection pipeline
         (injectPageMeta). Hardcoding per-host Dandy strings here used to
         clobber that page/tenant metadata in the browser — see task #999. -->
    <script>
      (function () {
        var h = location.hostname;
        var sel = function (s) { return document.querySelector(s); };
        var set = function (el, v) { if (el) el.setAttribute('content', v); };
        // Any lpstudio.ai host: the apex, www, app, and any *.lpstudio.ai
        // tenant subdomain. Matches exact apex or any subdomain of it.
        var isLpStudio = h === 'lpstudio.ai' || /(^|\.)lpstudio\.ai$/.test(h);
        if (isLpStudio) {
          var LP_TITLE = 'LP Studio — The AI Revenue Workspace for One-Team GTM';
          var LP_DESC = 'Generate on-brand pages, personalize for every account, and know exactly who\'s reading them. The AI revenue workspace for one-team GTM.';
          document.title = LP_TITLE;
          set(sel('meta[name="description"]'),       LP_DESC);
          set(sel('meta[property="og:title"]'),      LP_TITLE);
          set(sel('meta[property="og:description"]'),LP_DESC);
          set(sel('meta[property="og:url"]'),        location.origin);
          set(sel('meta[property="og:image"]'),      'https://lpstudio.ai/opengraph.jpg');
        }
      })();
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) — lp.meetdandy.com only, see head. -->
    <script>if (location.hostname === 'lp.meetdandy.com') { var n=document.createElement('noscript');var f=document.createElement('iframe');f.src='https://www.googletagmanager.com/ns.html?id=GTM-NHJFVSJ';f.height='0';f.width='0';f.style.cssText='display:none;visibility:hidden';n.appendChild(f);document.body.insertBefore(n, document.body.firstChild); }</script>
    <!-- End Google Tag Manager (noscript) -->
    <!-- Hide the pre-rendered marketing markup on hosts that mount the SaaS
         app (app.lpstudio.ai, tenant subdomains, custom tenant domains).
         Without this, SaaS visitors briefly see the marketing homepage
         before createRoot() in main.tsx replaces #root with the auth/app
         shell. The marketing app does its own host check in App.tsx and
         reveals the document when it mounts, so marketing visitors never
         see the hidden state.

         Mirrors `isMarketingHost()` in src/App.tsx — keep them in sync. -->
    <script>
      (function () {
        try {
          var h = (location.hostname || "").toLowerCase();
          var p = location.pathname.replace(/\/+$/, "") || "/";
          var qs = new URLSearchParams(location.search);
          var preview = qs.get("preview");
          var isMarketingPath = p === "/" || p === "/privacy" || p === "/terms";
          var isMarketingHost = h === "lpstudio.ai" || h === "www.lpstudio.ai";
          var isDev = h === "localhost" || h === "127.0.0.1" || h.endsWith(".replit.dev");
          var marketing = preview === "marketing"
            || (preview !== "app" && isMarketingHost)
            || (preview !== "app" && isDev && isMarketingPath);
          if (!marketing) {
            document.documentElement.style.visibility = "hidden";
            // Reveal on next frame after main.tsx executes; main.tsx also
            // clears this explicitly. Belt-and-suspenders timeout so a
            // bundle load failure doesn't leave the page permanently
            // hidden — the SaaS app's ErrorBoundary still needs to render.
            setTimeout(function () {
              document.documentElement.style.visibility = "";
            }, 4000);
          }
        } catch (_) {
          /* ignore — fall through to visible */
        }
      })();
    </script>
    <!-- Pre-mount loading indicator. Replaced as soon as React mounts into #root,
         so users see motion immediately on cold loads instead of a white screen
         while the JS bundle downloads. -->
    <style>
      #pre-mount-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 0;
      }
      #pre-mount-loader > div {
        width: 32px;
        height: 32px;
        border: 2px solid #0A0A0A;
        border-top-color: transparent;
        border-radius: 50%;
        animation: pre-mount-spin 0.8s linear infinite;
      }
      @keyframes pre-mount-spin { to { transform: rotate(360deg); } }
    </style>
    <div id="root">
      <div id="pre-mount-loader" aria-hidden="true"><div></div></div>
    </div>
    <!-- Prevent the prerendered marketing markup from flashing on hosts
         that mount the SaaS app (app.lpstudio.ai, tenant subdomains,
         custom tenant domains). On non-marketing hosts, swap #root back
         to just the pre-mount loader. This script is placed AFTER #root
         exists in the DOM and BEFORE the deferred module script, so it
         runs synchronously while #root still holds the prerendered
         marketing snapshot, and finishes before main.tsx executes —
         which means React mounts into the loader-only #root and is
         never clobbered. SaaS users see the loader (not a blank screen)
         and never glimpse marketing UI.

         Mirrors `isMarketingHost()` in src/App.tsx — keep in sync. -->
    <script>
      (function () {
        try {
          var h = (location.hostname || "").toLowerCase();
          var p = location.pathname.replace(/\/+$/, "") || "/";
          var qs = new URLSearchParams(location.search);
          var preview = qs.get("preview");
          var isMarketingPath = p === "/" || p === "/privacy" || p === "/terms";
          var isMarketingHost = h === "lpstudio.ai" || h === "www.lpstudio.ai";
          var isDev = h === "localhost" || h === "127.0.0.1" || h.endsWith(".replit.dev");
          var marketing = preview === "marketing"
            || (preview !== "app" && isMarketingHost)
            || (preview !== "app" && isDev && isMarketingPath);
          if (!marketing) {
            var root = document.getElementById("root");
            if (root) {
              root.innerHTML =
                '<div id="pre-mount-loader" aria-hidden="true"><div></div></div>';
            }
            // Strip the prerendered MarketingApp CSS chunk (tagged by
            // scripts/prerender-marketing.mjs with data-marketing-only).
            // Marketing.css has globally-scoped rules — body cream bg,
            // DM Sans h1-h6, * margin reset — plus a second @theme
            // inline block that overrides Tailwind v4 color tokens. If
            // we leave the <link> in place on tenant subdomains, those
            // rules leak into the SaaS admin chrome and the landing-page
            // viewer (cream behind blocks, wrong heading font, dark
            // borders). Removing the <link> element also detaches its
            // CSSStyleSheet from document.styleSheets, so any styles the
            // browser already applied from it are reverted before paint.
            var marketingLinks = document.querySelectorAll(
              'link[data-marketing-only="1"]',
            );
            for (var i = 0; i < marketingLinks.length; i++) {
              marketingLinks[i].parentNode.removeChild(marketingLinks[i]);
            }
          }
        } catch (_) {
          /* ignore — fall through to whatever is in the DOM */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
