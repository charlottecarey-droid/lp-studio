    <!-- Defensive stub for `window.webkit.messageHandlers`. iOS Safari
         (and the Facebook / Instagram in-app browsers in particular) does
         NOT define `window.webkit` outside of a WKWebView bridge, but
         several third-party tags we load via GTM / Marketo probe it
         without a guard (e.g. `window.webkit.messageHandlers.foo`),
         which throws `TypeError: undefined is not an object` and
         bubbles to Sentry. Defining a harmless empty stub at the top
         of <head> — before ANY other script runs — lets the probe read
         `undefined` instead of throwing, eliminating the error class
         entirely. Safe to set on real WKWebViews too: native bridges
         set `window.webkit` BEFORE any page script runs, so our `if`
         guard leaves real bridges untouched. -->
    <script>
      if (typeof window.webkit === 'undefined') {
        window.webkit = { messageHandlers: {} };
      } else if (!window.webkit.messageHandlers) {
        window.webkit.messageHandlers = {};
      }
    </script>

    <!-- Prevent the pre-rendered marketing markup from flashing on hosts that
         mount the SaaS app (app.lpstudio.ai, tenant subdomains, custom tenant
         domains). Without this, SaaS visitors would briefly see the static
         marketing homepage before createRoot() in main.tsx replaces #root
         with the auth/app shell.

         Strategy: on non-marketing hosts, swap #root back to just the
         pre-mount loader BEFORE the JS bundle runs. This both hides the
         marketing content AND keeps the loader visible (vs the old
         html.visibility=hidden approach, which left SaaS users staring at
         a blank screen during cold boot).

         Mirrors `isMarketingHost()` in src/App.tsx — keep them in sync. -->
    <script>
      (function () {
        try {
          var h = (location.hostname || "").toLowerCase();
          var p = location.pathname.replace(/\/+$/, "") || "/";
          var qs = new URLSearchParams(location.search);
          var preview = qs.get("preview");
          var isMarketingPath = p === "/" || p === "/privacy" || p === "/terms";
          var isMarketingHost = h === "lpstudio.ai" || h === "www.lpstudio.ai";
          var isDev = h === "localhost" || h === "127.0.0.1" || h.endsWith(".replit.dev");
          var marketing = preview === "marketing"
            || (preview !== "app" && isMarketingHost)
            || (preview !== "app" && isDev && isMarketingPath);
          if (!marketing) {
            // Replace prerendered marketing content with just the loader.
            // Use DOMContentLoaded if #root isn't parsed yet (this script
            // runs in <head>); otherwise apply immediately.
            var swap = function () {
              var root = document.getElementById("root");
              if (root) {
                root.innerHTML =
                  '<div id="pre-mount-loader" aria-hidden="true"><div></div></div>';
              }
            };
            if (document.getElementById("root")) {
              swap();
            } else {
              document.addEventListener("DOMContentLoaded", swap, { once: true });
            }
          }
        } catch (_) {
          /* ignore — fall through to whatever is in the DOM */
        }
      })();
    </script>
    <!-- Pre-mount loading indicator. Replaced as soon as React mounts into #root,
         so users see motion immediately on cold loads instead of a white screen
         while the JS bundle downloads. -->
    <style>
      #pre-mount-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 0;
      }
      #pre-mount-loader > div {
        width: 32px;
        height: 32px;
        border: 2px solid #0A0A0A;
        border-top-color: transparent;
        border-radius: 50%;
        animation: pre-mount-spin 0.8s linear infinite;
      }
      @keyframes pre-mount-spin { to { transform: rotate(360deg); } }
    </style>
    <div id="root">
      <div id="pre-mount-loader" aria-hidden="true"><div></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
