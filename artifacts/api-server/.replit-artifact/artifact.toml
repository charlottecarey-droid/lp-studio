kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Task #191 — chained smoke check runs as part of every production deploy
# build (not just the postMerge hook). After the api-server build succeeds,
# `smoke-tenant-hosts` probes /api/auth/domain-context on every active
# tenant host and exits non-zero if any returns 403/5xx. A failure here
# fails the deploy build, blocking cutover when host-level routing
# (DNS / custom-domain registration / edge worker) is already broken.
# Set SMOKE_SKIP_TENANT_HOSTS=1 to bypass when intentionally deploying
# against an environment where the live hosts aren't yet pointed here.
args = ["sh", "-c", "pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/api-server run migrate && if [ \"${SMOKE_SKIP_TENANT_HOSTS:-0}\" != \"1\" ]; then pnpm --filter @workspace/scripts run smoke-tenant-hosts; fi && rm -rf .pnpm-store .config/chromium .backups"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production.
#
# `--import .../dist/instrument.mjs` MUST be present and MUST come before the
# main entrypoint. instrument.mjs initializes Sentry (and loads dotenv);
# Sentry's express/http auto-instrumentation only works if it hooks Node's
# module loader BEFORE express is imported, which only happens via this
# `--import` flag. See `src/instrument.ts` for the full rationale.
#
# This flag drifted out once already (task #189) and shipped to prod with
# Sentry effectively disabled. `build.mjs` now fails the build if the args
# below stop matching the contract — keep it in sync.
args = [
  "node",
  "--enable-source-maps",
  "--import",
  "./artifacts/api-server/dist/instrument.mjs",
  "artifacts/api-server/dist/index.mjs",
]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
# Probe the unconditional /healthz route (registered directly on the express
# app in src/app.ts before the /api/* readiness gate). The /api/healthz
# route sits BEHIND the readiness gate, which 503s every request until the
# idempotent migration batch in server.ts finishes — on a cold start that
# can exceed Cloud Run's startup-probe window and fail the deploy promote
# step even though the build itself succeeded. /healthz returns 200 as
# soon as the port is bound, while the readiness gate keeps real /api/*
# traffic returning 503+Retry-After until migrations complete.
path = "/healthz"
